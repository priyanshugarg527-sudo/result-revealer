{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white"><h5>✏️ Edit Student</h5></div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control"
                               value="{{ student.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Roll Number</label>
                        <input type="text" name="roll_number" class="form-control"
                               value="{{ student.roll_number }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Branch</label>
                        <select name="branch" class="form-select" required>
                            {% for branch in branches %}
                            <option value="{{ branch }}"
                                {{ 'selected' if student.branch == branch }}>
                                {{ branch }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Semester</label>
                        <select name="semester" class="form-select" required>
                            {% for i in range(1, 9) %}
                            <option value="{{ i }}"
                                {{ 'selected' if student.semester == i }}>
                                Semester {{ i }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        💾 Save Changes
                    </button>
                </form>
            </div>
        </div>
        <a href="{{ url_for('manage_students') }}"
           class="btn btn-secondary mt-3 w-100">← Back</a>
    </div>
</div>
{% endblock %}
